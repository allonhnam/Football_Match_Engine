<style>
  /* Layout: app shell. 56px top bar; Matchday = pitch column + 400px touchline rail, full height.
     Tokens follow the Figma "Match Engine" design: near-black green surfaces, lime accent, periwinkle away kit. */
  :root {
    --c-bg: 11 15 14; --c-surface: 20 26 24; --c-surface2: 28 36 33; --c-line: 42 52 48;
    --c-ink: 232 237 234; --c-dim: 138 151 146; --c-accent: 198 244 50; --c-accentink: 11 15 14;

      --c-ink: 17 22 20; --c-dim: 91 102 97; --c-accent: 94 140 0; --c-accentink: 255 255 255;

    --c-ink: 17 22 20; --c-dim: 91 102 97; --c-accent: 94 140 0; --c-accentink: 255 255 255;
    --c-good: 22 150 95; --c-warn: 196 118 0; --c-bad: 205 48 54; --c-yellow: 196 150 0; --c-away: 76 108 235;
    color-scheme: light;

  html, body { background: var(--bg); color: var(--ink); height: 100%; }
  body { font-family: Inter, system-ui, sans-serif; font-size: 13px; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
  .gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .tnum { font-variant-numeric: tabular-nums; }

  .scroll-thin { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .scroll-thin::-webkit-scrollbar { width: 6px; height: 6px; } .scroll-thin::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }

  .pop { animation: pop .6s ease-out; }
  @keyframes pulse2 { 50% { opacity: .35; } } .livedot { animation: pulse2 1.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .slidein, .pop, .livedot { animation: none; } }
  input[type=range] { accent-color: var(--accent); }

<script type="text/babel" data-presets="react">
const E = window.MatchEngine;

// ================================================================ helpers

const ATTR_LABEL = { pace: 'Pace', stamina: 'Stamina', passing: 'Passing', vision: 'Vision', dribbling: 'Dribbling', shooting: 'Finishing', heading: 'Heading', tackling: 'Tackling', positioning: 'Positioning', keeping: 'Goalkeeping' };
const TACTIC_META = {
  mentality: { label: 'Mentality', sub: 'Changes chance creation and risk', opts: ['Cautious', 'Balanced', 'Attacking'], hints: ['Deeper block, fewer counters conceded', 'Balanced risk', 'More shots, more counters conceded'] },
  pressing: { label: 'Pressing intensity', sub: 'Higher pressure increases fatigue', opts: ['Low', 'Mid', 'High'], hints: ['Saves legs, gives up territory', 'Presses in our half', 'More turnovers, faster fatigue, more fouls'] },
  line: { label: 'Defensive line', sub: 'How high the back line holds', opts: ['Deep', 'Medium', 'High'], hints: ['Space in front, fewer balls in behind', 'Holding a medium line', 'Compact, wins offsides, exposed to pace'] },
  width: { label: 'Width', sub: 'Where attacks are built', opts: ['Narrow', 'Normal', 'Wide'], hints: ['Central overloads, fewer crosses', 'Standard', 'More crosses, stretched defence'] },
  tempo: { label: 'Tempo', sub: 'How quickly the ball moves', opts: ['Slow', 'Normal', 'Fast'], hints: ['Control, less fatigue', 'Standard', 'More attacks, less control'] },
  passing: { label: 'Passing', sub: 'Pass length and risk', opts: ['Short', 'Mixed', 'Direct'], hints: ['Safe and short', 'Mixed', 'Long balls, more risk, more reward'] },
};
const SPEEDS = [{ k: '1×', gps: 12 }, { k: '2×', gps: 24 }, { k: '4×', gps: 48 }, { k: '16×', gps: 192 }];
const BANNER_TYPES = { goal: 1, yellow: 1, red: 1, sub: 1, injury: 1, penalty: 1 };
const RESTART_LABEL = { kickoff: 'Kick-off', freekick: 'Free kick', corner: 'Corner', throwin: 'Throw-in', goalkick: 'Goal kick', penalty: 'Penalty' };
function posLabel(formation, slot) {
  const s = E.FORMATIONS[formation][slot]; if (!s) return '';
  const [role, sx, sy] = s;
  if (role === 'GK') return 'GK';
  const side = sy < 0.25 ? 'L' : sy > 0.75 ? 'R' : 'C';
  if (role === 'DF') return side === 'C' ? 'CB' : side + (sx > 0.06 ? 'WB' : 'B');
  if (role === 'MF') { if (side !== 'C') return sx > 0.6 ? side + 'W' : side + 'M'; return sx < 0.36 ? 'DM' : sx > 0.6 ? 'AM' : 'CM'; }
  return side === 'C' ? 'ST' : side + 'W';
}
function textOn(hex) { const c = (hex || '#000').replace('#', ''); const r = parseInt(c.slice(0, 2), 16), g = parseInt(c.slice(2, 4), 16), b = parseInt(c.slice(4, 6), 16); return (r * 299 + g * 587 + b * 114) / 1000 > 150 ? '#0B0F0E' : '#FFFFFF'; }
function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function defaultTeams() {
  return {
    home: E.makeTeam({ name: 'Northbridge FC', short: 'NBR', seed: 11, strength: 13, color: '#C6F432', formation: '4-3-3' }),
    away: E.makeTeam({ name: 'Harbour City', short: 'HBR', seed: 22, strength: 12, color: '#6E8CFF', formation: '4-2-3-1' }),
  };
}
function rebuildSquad(team, patch) { return E.makeTeam({ name: team.name, short: team.short, color: team.color, seed: patch.seed ?? team.seed, strength: patch.strength ?? team.strength, formation: team.formation, tactics: team.tactics }); }

// ================================================================ batch runner (Web Workers, main-thread fallback)
function summarise(r) {
  if (r.errors) return { errors: r.errors };
  var ev = r.events, pens = 0, inj = 0, goalTimes = [];
  for (var i = 0; i < ev.length; i++) { if (ev[i].type === 'penalty') pens++; if (ev[i].type === 'injury') inj++; if (ev[i].type === 'goal') goalTimes.push(ev[i].t); }
  return { score: r.score, pens: pens, injuries: inj, goalTimes: goalTimes, ts: r.teamStats.map(function (s) { return { shots: s.shots, onTarget: s.onTarget, xg: s.xg, corners: s.corners, fouls: s.fouls, yellows: s.yellows, reds: s.reds, offsides: s.offsides, passes: s.passes, passesOk: s.passesOk, pos: s.possessionPct }; }) };
}
let srcPromise = null;
function engineSource() { if (!srcPromise) srcPromise = fetch('engine.js').then(r => { if (!r.ok) throw new Error('no source'); return r.text(); }); return srcPromise; }
const WORKER_MAIN = 'self.onmessage=function(ev){var js=ev.data.jobs;for(var k=0;k<js.length;k++){var r=MatchEngine.simulateMatch(js[k].cfg);self.postMessage({i:js[k].i,one:summarise(r)});}self.postMessage({end:true});};';
async function runBatch(jobs, onProgress) {
  const results = new Array(jobs.length); let done = 0;

    const src = await engineSource();
    const n = Math.max(1, Math.min(6, (navigator.hardwareConcurrency || 2) - 1, jobs.length));
    const url = URL.createObjectURL(new Blob([src + '\n' + summarise.toString() + '\n' + WORKER_MAIN], { type: 'text/javascript' }));
    await Promise.all(Array.from({ length: n }, (_, w) => new Promise((res, rej) => {
      const wk = new Worker(url); const mine = []; for (let i = w; i < jobs.length; i += n) mine.push({ i, cfg: jobs[i] });
      wk.onmessage = e => { if (e.data.one) { results[e.data.i] = e.data.one; done++; onProgress && onProgress(done / jobs.length); } if (e.data.end) { wk.terminate(); res(); } };
      wk.onerror = err => { wk.terminate(); rej(err); };
      wk.postMessage({ jobs: mine });
    })));
    URL.revokeObjectURL(url); return results;
  } catch (e) {
    for (let i = 0; i < jobs.length; i++) { if (results[i]) continue; results[i] = summarise(E.simulateMatch(jobs[i])); onProgress && onProgress((i + 1) / jobs.length); if (i % 2) await new Promise(r => setTimeout(r, 0)); }
    return results;
  }
}

// ================================================================ icons + UI kit
const I = {
  play: <path d="M7 5l12 7-12 7z" fill="currentColor" />, pause: <g fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1" /><rect x="14" y="5" width="4" height="14" rx="1" /></g>,
  next: <g fill="currentColor"><path d="M5 5l10 7-10 7z" /><rect x="16" y="5" width="3" height="14" rx="1" /></g>, skip: <g fill="currentColor"><path d="M3 5l9 7-9 7z" /><path d="M12 5l9 7-9 7z" /></g>,
  cam: <g fill="none" stroke="currentColor" strokeWidth="1.8"><rect x="3" y="7" width="18" height="13" rx="2" /><circle cx="12" cy="13.5" r="3.5" /><path d="M8 7l1.5-3h5L16 7" /></g>,
  tag: <g fill="none" stroke="currentColor" strokeWidth="1.8"><rect x="3" y="6" width="18" height="12" rx="2" /><path d="M7 12h10" /></g>,

  sun: <g fill="none" stroke="currentColor" strokeWidth="1.8"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></g>,
  moon: <path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z" fill="none" stroke="currentColor" strokeWidth="1.8" />,
  gear: <g fill="none" stroke="currentColor" strokeWidth="1.8"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z" /></g>,
  chev: <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" strokeWidth="2" />, check: <path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" strokeWidth="2.2" />,
  up: <path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" strokeWidth="2" />, copy: <g fill="none" stroke="currentColor" strokeWidth="1.8"><rect x="8" y="8" width="12" height="12" rx="2" /><path d="M16 8V5a1 1 0 00-1-1H5a1 1 0 00-1 1v10a1 1 0 001 1h3" /></g>,
  back: <path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" strokeWidth="2" />, x: <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" strokeWidth="2" />,
};

// ================================================================ top bar

          </ul>
        </nav>

      </div>

  const setFormation = f => setTeam(tm => { const pick = E.autoPick(tm.players, f); return { ...tm, formation: f, xi: pick.xi, bench: pick.bench }; });
  const autoPick = () => setTeam(tm => { const pick = E.autoPick(tm.players, tm.formation); return { ...tm, xi: pick.xi, bench: pick.bench }; });

function XgRace({ R, teams }) {

    <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto" role="img" aria-label="Cumulative expected goals">
      {ticks.map(v => <g key={v}><line x1={L} x2={W - Rm} y1={Y(v)} y2={Y(v)} stroke="var(--line)" /><text x={L - 6} y={Y(v) + 4} textAnchor="end" fontSize="10.5" fill="var(--dim)" fontFamily="JetBrains Mono">{v.toFixed(1)}</text></g>)}

      <path d={path(2)} fill="none" stroke={teams[1].color} strokeWidth="2.5" /><path d={path(1)} fill="none" stroke={teams[0].color} strokeWidth="2.5" />
      {R.events.filter(e => e.type === 'goal').map((e, i) => <circle key={i} cx={X(e.t)} cy={Y(xgAt(e.t, e.side + 1))} r="5.5" fill={teams[e.side].color} stroke="var(--surface)" strokeWidth="2" />)}
      <text x={W - Rm} y={Y(tl[tl.length - 1][1]) - 7} textAnchor="end" fontSize="11.5" fontWeight="700" fill={teams[0].color}>{teams[0].short} {fx(tl[tl.length - 1][1], 2)}</text>
      <text x={W - Rm} y={Y(tl[tl.length - 1][2]) + 16} textAnchor="end" fontSize="11.5" fontWeight="700" fill={teams[1].color}>{teams[1].short} {fx(tl[tl.length - 1][2], 2)}</text>
    </svg>

    <div className="min-h-full">
      <TopBar view={view} setView={setView} hasReport={!!report} theme={theme} setTheme={setTheme} seed={session ? session.config.seed : seed} onSettings={() => setShowSettings(true)} liveTag={!!session && view !== 'matchday'} />
      {showSettings && <SettingsPanel settings={settings} setSettings={setSettings} onClose={() => setShowSettings(false)} onClearHistory={() => { setHistory([]); store.set('me-history', []); }} onEndMatch={() => setSession(null)} hasSession={!!session} theme={theme} setTheme={setTheme} />}
      <main>
        {view === 'matchday' && !session && <Setup teams={teams} setTeams={setTeams} seed={seed} setSeed={setSeed} venue={venue} setVenue={setVenue} control={control} setControl={setControl} onKickoff={kickoff} onSimulate={simulate} history={history} onReplay={h => replay(h.config, h.commands)} onEditTactics={s => { setBoardSide(s); setView('tactics'); }} />}
        {session && <div hidden={view !== 'matchday'}><LiveMatch key={session.key} session={session} active={view === 'matchday'} settings={settings} control={session.mode === 'replay' ? 'none' : session.config.control} onFinished={onFinished} onNewMatch={() => { setSession(null); setView('matchday'); }} /></div>}
        {view === 'tactics' && <TacticsBoard teams={teams} setTeams={setTeams} side={boardSide} setSide={setBoardSide} />}
        {view === 'report' && report && <Report report={report} onReplay={() => replay(report.config, report.commands)} onBack={() => { setSession(null); setView('matchday'); }} />}
        {view === 'lab' && <Lab />}
      </main>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
