name: CI

# Typecheck, test, simulate a match and build the front end on every platform the brief requires.
# Linux runs everything on both supported Node versions. Windows and macOS (billed at 2x and 10x for private
# repositories) run once each with QUICK_TESTS: the statistical tests give identical results on every OS, because
# the engine is deterministic plain JavaScript, so they only need to run on Linux.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

# a new push cancels the run for the commit it replaces
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}${{ matrix.quick && ' · quick tests' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 22 }
          - { os: windows-latest, node: 20, quick: true }
          - { os: macos-latest, node: 22, quick: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          QUICK_TESTS: ${{ matrix.quick && '1' || '' }}
      - run: npm run simulate -- --seed 42
      - run: npm run build
