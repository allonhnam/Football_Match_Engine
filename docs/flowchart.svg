<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1310" width="1040" height="1310" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <title>Match engine flowchart: the life of one match</title>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#5B4F7A" flood-opacity="0.12"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6E6585"/>
    </marker>
    <style>
      .h  { font-size:13px; font-weight:800; letter-spacing:1.6px; }
      .t  { fill:#2E2A3A; font-size:15px; font-weight:700; text-anchor:middle; }
      .tl { fill:#2E2A3A; font-size:14.5px; font-weight:700; }
      .s  { fill:#5A5370; font-size:12.5px; text-anchor:middle; }
      .sl { fill:#5A5370; font-size:12.5px; }
      .xs { fill:#5A5370; font-size:11.5px; text-anchor:middle; }
      .m  { font-family: Consolas, 'Cascadia Code', Menlo, monospace; fill:#4A4360; font-size:11.5px; text-anchor:middle; }
      .ml { font-family: Consolas, 'Cascadia Code', Menlo, monospace; fill:#4A4360; font-size:11.5px; }
      .ln { fill:none; stroke:#6E6585; stroke-width:2; }
      .dl { fill:none; stroke:#6E6585; stroke-width:1.8; stroke-dasharray:6 5; }
      .lab{ fill:#4A4360; font-size:12px; font-weight:700; }
      .card { fill:#FFFFFF; stroke:#A893E0; stroke-width:1.5; }
      .num { fill:#6A52B8; font-size:15px; font-weight:800; }
    </style>
  </defs>

  <rect width="1040" height="1310" fill="#FBFAF7"/>
  <text x="520" y="44" text-anchor="middle" font-size="26" font-weight="800" fill="#2E2A3A">The life of one match</text>
  <text x="520" y="70" text-anchor="middle" font-size="14" fill="#6E6585">Check the line-ups, kick off, then repeat one tick every 0.25 s of play until the result.</text>

  <!-- start -->
  <g filter="url(#sh)"><rect x="320" y="94" width="360" height="62" rx="31" fill="#C8EFD9" stroke="#84C8A2" stroke-width="2"/></g>
  <text class="t" x="500" y="120">Start · new Match(config)</text>
  <text class="s" x="500" y="141">two squads · tactics · formation · seed · league or cup</text>
  <line class="ln" x1="500" y1="156" x2="500" y2="184" marker-end="url(#ar)"/>

  <!-- lineup legal -->
  <g filter="url(#sh)"><polygon points="500,188 620,230 500,272 380,230" fill="#FFDCC2" stroke="#E7A77A" stroke-width="2"/></g>
  <text class="t" x="500" y="228">Line-ups legal?</text>
  <text class="m" x="500" y="246">validateLineup()</text>
  <line class="ln" x1="380" y1="230" x2="254" y2="230" marker-end="url(#ar)"/>
  <text class="lab" x="306" y="222">No</text>
  <g filter="url(#sh)"><rect x="60" y="198" width="190" height="64" rx="12" fill="#FBD3E3" stroke="#DE93B4" stroke-width="1.8"/></g>
  <text class="t" x="155" y="225">Return the errors</text>
  <text class="s" x="155" y="245">typed, never thrown</text>
  <line class="ln" x1="500" y1="272" x2="500" y2="298" marker-end="url(#ar)"/>
  <text class="lab" x="510" y="290">Yes</text>

  <!-- kick-off -->
  <g filter="url(#sh)"><rect x="360" y="302" width="280" height="50" rx="12" fill="#FFF1B8" stroke="#D9BE5C" stroke-width="1.8"/></g>
  <text class="t" x="500" y="324">Kick-off</text>
  <text class="s" x="500" y="342">both teams in their own half</text>
  <line class="ln" x1="500" y1="352" x2="500" y2="380" marker-end="url(#ar)"/>

  <!-- ===== tick loop ===== -->
  <rect x="240" y="384" width="520" height="458" rx="20" fill="#EEE8FD" stroke="#A893E0" stroke-width="2" stroke-dasharray="7 5"/>
  <text class="h" x="262" y="410" fill="#6A52B8">EVERY TICK · 0.25 s OF PLAY</text>
  <text class="sl" x="738" y="410" text-anchor="end">about 22,000 a match</text>

  <g filter="url(#sh)">
    <rect class="card" x="264" y="424" width="472" height="56" rx="12"/>
    <rect class="card" x="264" y="490" width="472" height="56" rx="12"/>
    <rect class="card" x="264" y="556" width="472" height="56" rx="12"/>
    <rect class="card" x="264" y="622" width="472" height="138" rx="12"/>
    <rect class="card" x="264" y="770" width="472" height="56" rx="12"/>
  </g>
  <text class="num" x="282" y="448">1</text><text class="tl" x="302" y="448">Move the clock on 0.25 s</text>
  <text class="sl" x="302" y="468"><tspan class="ml">step()</tspan>; <tspan class="ml">runUntil()</tspan> and <tspan class="ml">runToEnd()</tspan> call it in a loop</text>

  <text class="num" x="282" y="514">2</text><text class="tl" x="302" y="514">Ball dead? Take the set piece</text>
  <text class="sl" x="302" y="534">walk to the spots · a late leader wastes time · 5-second count</text>

  <text class="num" x="282" y="580">3</text><text class="tl" x="302" y="580">Move every player off the ball</text>
  <text class="sl" x="302" y="600">formation shape · runs into space · marking · pressing · tiredness</text>

  <text class="num" x="282" y="646">4</text><text class="tl" x="302" y="646">Play the ball: where is it?</text>
  <rect x="280" y="658" width="144" height="92" rx="10" fill="#E4F1FC" stroke="#8DBBE3"/>
  <rect x="428" y="658" width="144" height="92" rx="10" fill="#E3F6EC" stroke="#84C8A2"/>
  <rect x="576" y="658" width="144" height="92" rx="10" fill="#FFEBDD" stroke="#E7A77A"/>
  <text class="t" x="352" y="678" style="font-size:13px">At a player's feet</text>
  <text class="xs" x="352" y="697">he picks: shoot, pass,</text>
  <text class="xs" x="352" y="713">cross, carry or clear</text>
  <text class="m" x="352" y="736">_decide()</text>
  <text class="t" x="500" y="678" style="font-size:13px">In the air</text>
  <text class="xs" x="500" y="697">a pass lands or is cut out</text>
  <text class="xs" x="500" y="713">shot: blocked, saved, goal</text>
  <text class="m" x="500" y="736">_flight()</text>
  <text class="t" x="648" y="678" style="font-size:13px">Loose</text>
  <text class="xs" x="648" y="697">nearest players chase it</text>
  <text class="xs" x="648" y="713">or it goes out of play</text>
  <text class="m" x="648" y="736">_looseBall()</text>

  <text class="num" x="282" y="794">5</text><text class="tl" x="302" y="794">Referee, then record what happened</text>
  <text class="sl" x="302" y="814">offside · fouls · cards · advantage → events, commentary, stats</text>
  <line class="ln" x1="500" y1="842" x2="500" y2="862" marker-end="url(#ar)"/>

  <!-- period over -->
  <g filter="url(#sh)"><polygon points="500,866 620,908 500,950 380,908" fill="#FFDCC2" stroke="#E7A77A" stroke-width="2"/></g>
  <text class="t" x="500" y="906">Half over?</text>
  <text class="xs" x="500" y="924">45′ + added time</text>
  <path class="ln" d="M380,908 H214 V452 H260" marker-end="url(#ar)"/>
  <text class="lab" x="228" y="900">No · next tick</text>
  <line class="ln" x1="500" y1="950" x2="500" y2="976" marker-end="url(#ar)"/>
  <text class="lab" x="510" y="968">Yes</text>

  <!-- another period -->
  <g filter="url(#sh)"><polygon points="500,980 630,1022 500,1064 370,1022" fill="#FFDCC2" stroke="#E7A77A" stroke-width="2"/></g>
  <text class="t" x="500" y="1018">Another period?</text>
  <text class="xs" x="500" y="1036">2nd half, or extra time</text>
  <path class="ln" d="M370,1022 H120 V327 H356" marker-end="url(#ar)"/>
  <text class="lab" x="134" y="1014">Yes · change ends</text>
  <line class="ln" x1="500" y1="1064" x2="500" y2="1090" marker-end="url(#ar)"/>
  <text class="lab" x="510" y="1082">No</text>

  <!-- cup tie level -->
  <g filter="url(#sh)"><polygon points="500,1094 630,1134 500,1174 370,1134" fill="#FFDCC2" stroke="#E7A77A" stroke-width="2"/></g>
  <text class="t" x="500" y="1131">Cup tie still level?</text>
  <text class="xs" x="500" y="1149">after extra time</text>
  <line class="ln" x1="630" y1="1134" x2="676" y2="1134" marker-end="url(#ar)"/>
  <text class="lab" x="638" y="1126">Yes</text>
  <g filter="url(#sh)"><rect x="680" y="1110" width="210" height="50" rx="12" fill="#FFF1B8" stroke="#D9BE5C" stroke-width="1.8"/></g>
  <text class="t" x="785" y="1132">Penalty shootout</text>
  <text class="s" x="785" y="1150">5 kicks each, then sudden death</text>
  <path class="ln" d="M785,1160 V1236 H684" marker-end="url(#ar)"/>
  <line class="ln" x1="500" y1="1174" x2="500" y2="1198" marker-end="url(#ar)"/>
  <text class="lab" x="510" y="1192">No</text>

  <!-- result -->
  <g filter="url(#sh)"><rect x="320" y="1202" width="360" height="68" rx="34" fill="#C8EFD9" stroke="#84C8A2" stroke-width="2"/></g>
  <text class="t" x="500" y="1228">Result · result() + explain()</text>
  <text class="s" x="500" y="1248">score · events · team and player stats · why</text>
  <text class="s" x="500" y="1264">carryOver: minutes, fatigue, injuries, cards</text>

  <!-- ===== side column ===== -->
  <g filter="url(#sh)"><rect x="790" y="424" width="220" height="190" rx="16" fill="#E4F1FC" stroke="#8DBBE3" stroke-width="1.8"/></g>
  <text class="tl" x="808" y="450">Manager commands</text>
  <text class="ml" x="808" y="474">substitute()</text>
  <text class="ml" x="808" y="491">setTactics()</text>
  <text class="ml" x="808" y="508">setFormation()</text>
  <text class="sl" x="808" y="534">applied at the next stoppage;</text>
  <text class="sl" x="808" y="551">logged, so save() and load()</text>
  <text class="sl" x="808" y="568">replay the match exactly.</text>
  <text class="sl" x="808" y="594">Other side: AI manager, every 10 s</text>
  <line class="dl" x1="790" y1="519" x2="764" y2="519" marker-end="url(#ar)"/>

  <g filter="url(#sh)"><rect x="790" y="640" width="220" height="186" rx="16" fill="#E3F6EC" stroke="#84C8A2" stroke-width="1.8"/></g>
  <text class="tl" x="808" y="666">Off the field (2026/27)</text>
  <text class="sl" x="808" y="692">treated player stays off until</text>
  <text class="sl" x="808" y="709">a minute after the restart</text>
  <text class="sl" x="808" y="735">substituted player walks off</text>
  <text class="sl" x="808" y="752">within 10 seconds</text>
  <text class="sl" x="808" y="778">dropped ball: to the keeper,</text>
  <text class="sl" x="808" y="795">or the team that had the ball</text>
  <text class="m" x="900" y="815">_treat() · _droppedBallSide()</text>
  <line class="dl" x1="790" y1="733" x2="764" y2="733" marker-end="url(#ar)"/>

  <!-- key -->
  <g font-size="12" fill="#5A5370">
    <rect x="60" y="1286" width="16" height="12" rx="6" fill="#C8EFD9" stroke="#84C8A2"/><text x="82" y="1297">start and end</text>
    <polygon points="186,1292 196,1286 206,1292 196,1298" fill="#FFDCC2" stroke="#E7A77A"/><text x="212" y="1297">a question</text>
    <rect x="290" y="1286" width="16" height="12" rx="3" fill="#EEE8FD" stroke="#A893E0" stroke-dasharray="3 2"/><text x="312" y="1297">repeats every tick</text>
    <line class="dl" x1="440" y1="1292" x2="476" y2="1292" marker-end="url(#ar)"/><text x="484" y="1297">feeds into the loop</text>
    <text class="ml" x="620" y="1297">monospace</text><text x="700" y="1297">= a name in the code</text>
  </g>
</svg>
