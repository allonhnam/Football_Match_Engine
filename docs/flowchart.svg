<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1660" width="1440" height="1660" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <title>Match engine flowchart: the life of one match</title>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#E6E1EF"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#6B5B8C" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6E6585"/>
    </marker>
    <marker id="arrowLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8C76D1"/>
    </marker>
    <style>
      .t  { fill:#2E2A3A; font-size:16px; font-weight:600; text-anchor:middle; dominant-baseline:middle; }
      .s  { fill:#5A5370; font-size:13px; text-anchor:middle; dominant-baseline:middle; }
      .m  { font-family: Consolas, 'Cascadia Code', Menlo, monospace; font-size:12.5px; fill:#4A4360; text-anchor:middle; dominant-baseline:middle; }
      .lbl{ fill:#6E6585; font-size:13px; font-weight:700; }
      .ln { fill:none; stroke:#6E6585; stroke-width:2; }
      .loop{ fill:none; stroke:#8C76D1; stroke-width:2.5; stroke-dasharray:8 6; }
      .dash{ fill:none; stroke:#5E9CCF; stroke-width:2; stroke-dasharray:5 5; }
      .pill{ fill:#C8EFD9; stroke:#5FAF85; stroke-width:2; }
      .para{ fill:#CDE6FA; stroke:#5E9CCF; stroke-width:2; }
      .proc{ fill:#E3DAFB; stroke:#8C76D1; stroke-width:2; }
      .dec { fill:#FFDCC2; stroke:#E0965A; stroke-width:2; }
      .hex { fill:#FFF1B8; stroke:#D1B23F; stroke-width:2; }
      .doc { fill:#FBD3E3; stroke:#D27AA0; stroke-width:2; }
      .lane{ fill:#FFFFFF; fill-opacity:0.55; stroke:#E4DEEE; stroke-width:1.5; stroke-dasharray:4 6; }
      .laneT{ fill:#9A91B0; font-size:12px; font-weight:700; letter-spacing:2px; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1440" height="1660" fill="#FBFAF7"/>
  <rect width="1440" height="1660" fill="url(#dots)"/>

  <!-- title -->
  <text x="720" y="50" text-anchor="middle" font-size="30" font-weight="700" fill="#2E2A3A">The life of one match</text>
  <text x="720" y="82" text-anchor="middle" font-size="15" fill="#6E6585">How src/engine/engine.js plays a match: validate, kick off, then loop step() every 0.25 s of game time until the result</text>

  <!-- lanes -->
  <rect class="lane" x="16" y="100" width="352" height="1420" rx="18"/>
  <text class="laneT" x="36" y="124">PERIODS &amp; RESULT</text>
  <rect class="lane" x="384" y="100" width="788" height="1420" rx="18"/>
  <text class="laneT" x="404" y="124">MAIN LOOP · ONE TICK</text>
  <rect class="lane" x="1188" y="100" width="236" height="1420" rx="18"/>
  <text class="laneT" x="1208" y="124">STOPPAGES</text>

  <!-- ============ MAIN COLUMN (cx = 780) ============ -->

  <!-- A start -->
  <g filter="url(#shadow)"><rect class="pill" x="630" y="140" width="300" height="52" rx="26"/></g>
  <text class="t" x="780" y="166">Start · new Match(config)</text>

  <!-- B input -->
  <line class="ln" x1="780" y1="192" x2="780" y2="218" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><polygon class="para" points="610,222 990,222 960,286 580,286"/></g>
  <text class="t" x="785" y="245">Input</text>
  <text class="s" x="785" y="268">two squads · tactics · formation · seed · league or cup</text>

  <!-- C lineup legal -->
  <line class="ln" x1="780" y1="286" x2="780" y2="306" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><polygon class="dec" points="780,310 910,368 780,426 650,368"/></g>
  <text class="t" x="780" y="360">Lineup legal?</text>
  <text class="m" x="780" y="384">validateLineup()</text>

  <!-- C no -> errors -->
  <polyline class="ln" points="650,368 342,368" marker-end="url(#arrow)"/>
  <text class="lbl" x="560" y="358">No</text>
  <g filter="url(#shadow)"><path class="doc" d="M60,336 H340 V392 Q270,412 200,392 T60,392 Z"/></g>
  <text class="t" x="200" y="356">Return { errors }</text>
  <text class="s" x="200" y="378">typed, never thrown</text>
  <line class="ln" x1="200" y1="402" x2="200" y2="424" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect class="pill" x="130" y="428" width="140" height="40" rx="20"/></g>
  <text class="t" x="200" y="448">End</text>

  <!-- D kick-off -->
  <line class="ln" x1="780" y1="426" x2="780" y2="472" marker-end="url(#arrow)"/>
  <text class="lbl" x="792" y="452">Yes</text>
  <g filter="url(#shadow)"><polygon class="hex" points="640,476 920,476 950,508 920,540 640,540 610,508"/></g>
  <text class="t" x="780" y="498">Kick-off restart</text>
  <text class="s" x="780" y="521">phase = dead · both teams in own half</text>

  <!-- E step -->
  <line class="ln" x1="780" y1="540" x2="780" y2="574" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect class="proc" x="550" y="578" width="460" height="78" rx="12" style="stroke-width:3.5"/></g>
  <text class="t" x="780" y="604" style="font-size:18px">step() · advance the clock 0.25 s</text>
  <text class="s" x="780" y="631">one seeded RNG: same inputs + seed + commands = same match</text>

  <!-- F period over -->
  <line class="ln" x1="780" y1="656" x2="780" y2="680" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><polygon class="dec" points="780,684 930,748 780,812 630,748"/></g>
  <text class="t" x="780" y="738">Period over?</text>
  <text class="s" x="780" y="762">45′ + added time</text>

  <!-- G ball dead -->
  <line class="ln" x1="780" y1="812" x2="780" y2="846" marker-end="url(#arrow)"/>
  <text class="lbl" x="792" y="832">No</text>
  <g filter="url(#shadow)"><polygon class="dec" points="780,850 905,906 780,962 655,906"/></g>
  <text class="t" x="780" y="898">Ball dead?</text>
  <text class="s" x="780" y="921">restart pending</text>

  <!-- H targets/move -->
  <line class="ln" x1="780" y1="962" x2="780" y2="992" marker-end="url(#arrow)"/>
  <text class="lbl" x="792" y="980">No</text>
  <g filter="url(#shadow)"><rect class="proc" x="590" y="996" width="380" height="66" rx="12"/></g>
  <text class="m" x="780" y="1018" style="font-size:14px;font-weight:700">_targets() + _move()</text>
  <text class="s" x="780" y="1042">off-ball shape · marking · pressing · fatigue</text>

  <!-- I where is the ball -->
  <line class="ln" x1="780" y1="1062" x2="780" y2="1090" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><polygon class="dec" points="780,1094 910,1150 780,1206 650,1150"/></g>
  <text class="t" x="780" y="1150">Where is the ball?</text>

  <!-- I branches -->
  <polyline class="ln" points="650,1150 520,1150 520,1236" marker-end="url(#arrow)"/>
  <text class="lbl" x="540" y="1140">at a player's feet</text>
  <line class="ln" x1="780" y1="1206" x2="780" y2="1236" marker-end="url(#arrow)"/>
  <text class="lbl" x="792" y="1226">in the air</text>
  <polyline class="ln" points="910,1150 1040,1150 1040,1236" marker-end="url(#arrow)"/>
  <text class="lbl" x="930" y="1140">loose</text>

  <!-- J1 carrier -->
  <g filter="url(#shadow)"><rect class="proc" x="405" y="1240" width="230" height="124" rx="12"/></g>
  <text class="t" x="520" y="1264">Carrier decides</text>
  <text class="m" x="520" y="1290">_decide()</text>
  <text class="s" x="520" y="1310">shoot · pass · cross · carry · clear</text>
  <text class="m" x="520" y="1334">_tackles()</text>
  <text class="s" x="520" y="1352">foul? card? advantage?</text>

  <!-- J2 flight -->
  <g filter="url(#shadow)"><rect class="proc" x="665" y="1240" width="230" height="124" rx="12"/></g>
  <text class="t" x="780" y="1264">Ball in flight</text>
  <text class="m" x="780" y="1290">_flight()</text>
  <text class="s" x="780" y="1310">pass arrives, cut out, offside</text>
  <text class="s" x="780" y="1334">shot: xG → save, wide, goal</text>
  <text class="s" x="780" y="1352">own goal · handball</text>

  <!-- J3 loose -->
  <g filter="url(#shadow)"><rect class="proc" x="925" y="1240" width="230" height="124" rx="12"/></g>
  <text class="t" x="1040" y="1264">Loose ball</text>
  <text class="m" x="1040" y="1290">_looseBall() · _checkOut()</text>
  <text class="s" x="1040" y="1316">nearest players chase</text>
  <text class="s" x="1040" y="1340">throw-in · corner · goal kick</text>

  <!-- merge to K -->
  <polyline class="ln" points="520,1364 520,1392 760,1392 760,1406" marker-end="url(#arrow)"/>
  <line class="ln" x1="780" y1="1364" x2="780" y2="1406" marker-end="url(#arrow)"/>
  <polyline class="ln" points="1040,1364 1040,1392 800,1392 800,1406" marker-end="url(#arrow)"/>

  <!-- K events -->
  <g filter="url(#shadow)"><polygon class="para" points="590,1410 1000,1410 970,1466 560,1466"/></g>
  <text class="t" x="780" y="1430">Emit events</text>
  <text class="s" x="780" y="1452">live view · commentary · stats · momentum</text>

  <!-- L AI -->
  <line class="ln" x1="780" y1="1466" x2="780" y2="1486" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect class="proc" x="610" y="1488" width="340" height="24" rx="12"/></g>
  <text class="s" x="780" y="1501" style="font-weight:600">every 10 s: AI manager · forwards' runs</text>

  <!-- loop back to step -->
  <polyline class="loop" points="950,1500 1410,1500 1410,617 1014,617" marker-end="url(#arrowLoop)"/>
  <rect x="1290" y="1004" width="112" height="44" rx="10" fill="#FBFAF7" stroke="#C9BCEF"/>
  <text x="1346" y="1021" text-anchor="middle" font-size="13" font-weight="700" fill="#8C76D1">next tick</text>
  <text x="1346" y="1038" text-anchor="middle" font-size="11.5" fill="#8C76D1">~22,000 per match</text>

  <!-- ============ STOPPAGES (right) ============ -->
  <!-- G yes -> restart -->
  <polyline class="ln" points="905,906 1196,906" marker-end="url(#arrow)"/>
  <text class="lbl" x="930" y="896">Yes</text>
  <g filter="url(#shadow)"><rect class="proc" x="1200" y="862" width="196" height="96" rx="12"/></g>
  <text class="t" x="1298" y="884">Set piece</text>
  <text class="s" x="1298" y="908">walk to restart spots</text>
  <text class="s" x="1298" y="928">taker in place →</text>
  <text class="m" x="1298" y="946">_resume()</text>
  <line class="loop" x1="1396" y1="910" x2="1410" y2="910"/>

  <!-- manager commands -->
  <g filter="url(#shadow)"><polygon class="para" points="1222,690 1400,690 1378,790 1200,790"/></g>
  <text class="t" x="1300" y="712">Manager</text>
  <text class="m" x="1300" y="736">substitute()</text>
  <text class="m" x="1300" y="754">setTactics()</text>
  <text class="m" x="1300" y="772">setFormation()</text>
  <line class="dash" x1="1298" y1="790" x2="1298" y2="858" marker-end="url(#arrow)"/>
  <text x="1306" y="822" font-size="11.5" fill="#5E9CCF" font-weight="700">applied at the</text>
  <text x="1306" y="838" font-size="11.5" fill="#5E9CCF" font-weight="700">next stoppage</text>
  <text x="1300" y="676" text-anchor="middle" font-size="11.5" fill="#9A91B0">logged for save() / replay</text>

  <!-- ============ PERIODS (left, cx = 192) ============ -->
  <!-- F yes -> end half -->
  <polyline class="ln" points="630,748 352,748" marker-end="url(#arrow)"/>
  <text class="lbl" x="560" y="738">Yes</text>
  <g filter="url(#shadow)"><rect class="proc" x="40" y="716" width="308" height="66" rx="12"/></g>
  <text class="m" x="194" y="738" style="font-size:14px;font-weight:700">_endHalf()</text>
  <text class="s" x="194" y="762">half-time or full-time whistle</text>

  <!-- another period -->
  <line class="ln" x1="194" y1="782" x2="194" y2="808" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><polygon class="dec" points="194,812 340,876 194,940 48,876"/></g>
  <text class="t" x="194" y="866">Another period?</text>
  <text class="s" x="194" y="890">2nd half, or extra time</text>
  <text class="s" x="194" y="907">in a level cup tie</text>
  <polyline class="ln" points="48,876 28,876 28,508 606,508" marker-end="url(#arrow)"/>
  <text class="lbl" x="40" y="498">Yes · change ends, new kick-off</text>

  <!-- cup still level -->
  <line class="ln" x1="194" y1="940" x2="194" y2="986" marker-end="url(#arrow)"/>
  <text class="lbl" x="206" y="966">No</text>
  <g filter="url(#shadow)"><polygon class="dec" points="194,990 330,1050 194,1110 58,1050"/></g>
  <text class="t" x="194" y="1044">Cup tie still level?</text>
  <text class="s" x="194" y="1066">after extra time</text>

  <!-- shootout -->
  <line class="ln" x1="194" y1="1110" x2="194" y2="1144" marker-end="url(#arrow)"/>
  <text class="lbl" x="206" y="1130">Yes</text>
  <g filter="url(#shadow)"><polygon class="hex" points="74,1148 314,1148 344,1180 314,1212 74,1212 44,1180"/></g>
  <text class="t" x="194" y="1170">Penalty shootout</text>
  <text class="s" x="194" y="1194">5 each, then sudden death</text>

  <polyline class="ln" points="58,1050 28,1050 28,1270 66,1270" marker-end="url(#arrow)"/>
  <text class="lbl" x="36" y="1040">No</text>

  <!-- result -->
  <line class="ln" x1="194" y1="1212" x2="194" y2="1240" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect class="proc" x="70" y="1244" width="248" height="62" rx="12"/></g>
  <text class="m" x="194" y="1264" style="font-size:14px;font-weight:700">result() + explain()</text>
  <text class="s" x="194" y="1288">verdict · ranked factors</text>

  <line class="ln" x1="194" y1="1306" x2="194" y2="1330" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><path class="doc" d="M54,1334 H334 V1424 Q264,1446 194,1424 T54,1424 Z"/></g>
  <text class="t" x="194" y="1356">Result object</text>
  <text class="s" x="194" y="1380">score · events · team &amp; player stats</text>
  <text class="s" x="194" y="1400">carryOver · winner · shootout</text>

  <line class="ln" x1="194" y1="1436" x2="194" y2="1460" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect class="pill" x="114" y="1464" width="160" height="42" rx="21"/></g>
  <text class="t" x="194" y="1485">End</text>

  <!-- ============ LEGEND ============ -->
  <rect x="16" y="1544" width="1408" height="96" rx="18" fill="#FFFFFF" stroke="#E4DEEE" stroke-width="1.5"/>
  <text class="laneT" x="40" y="1572">KEY</text>

  <rect class="pill" x="40" y="1588" width="70" height="32" rx="16"/>
  <text x="122" y="1609" font-size="14" fill="#2E2A3A">Start / end</text>

  <polygon class="para" points="250,1588 314,1588 304,1620 240,1620"/>
  <text x="326" y="1609" font-size="14" fill="#2E2A3A">Input / output</text>

  <rect class="proc" x="470" y="1588" width="70" height="32" rx="8"/>
  <text x="552" y="1609" font-size="14" fill="#2E2A3A">Process</text>

  <polygon class="dec" points="680,1584 716,1604 680,1624 644,1604"/>
  <text x="728" y="1609" font-size="14" fill="#2E2A3A">Decision</text>

  <polygon class="hex" points="844,1588 896,1588 908,1604 896,1620 844,1620 832,1604"/>
  <text x="920" y="1609" font-size="14" fill="#2E2A3A">Phase change</text>

  <path class="doc" d="M1046,1586 H1110 V1614 Q1094,1622 1078,1614 T1046,1614 Z"/>
  <text x="1122" y="1609" font-size="14" fill="#2E2A3A">Returned data</text>

  <line class="loop" x1="1250" y1="1604" x2="1300" y2="1604" marker-end="url(#arrowLoop)"/>
  <text x="1310" y="1609" font-size="14" fill="#2E2A3A">Tick loop</text>
</svg>
