<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <title>Match engine system design</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 z" fill="#6E6A86"/>
    </marker>
    <style>
      .t { font-size: 26px; font-weight: 700; fill: #2B2840; }
      .s { font-size: 14px; fill: #6E6A86; }
      .lab { font-size: 12px; font-weight: 700; letter-spacing: 1.6px; }
      .labs { font-size: 12px; fill: #6E6A86; }
      .h { font-size: 15px; font-weight: 700; fill: #2B2840; }
      .b { font-size: 12.5px; fill: #4A4763; }
      .m { font-size: 12px; fill: #4A4763; font-family: Menlo, Consolas, monospace; }
      .pill { font-size: 12px; font-weight: 600; fill: #4A4763; }
      .card { fill: #FFFFFF; stroke-width: 1.2; }
      .line { stroke: #6E6A86; stroke-width: 1.5; fill: none; }
      .dash { stroke: #6E6A86; stroke-width: 1.5; fill: none; stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect width="1200" height="850" fill="#FBFAF7"/>

  <text x="600" y="48" text-anchor="middle" class="t">Match engine · system design</text>
  <text x="600" y="76" text-anchor="middle" class="s">One engine in the middle. The web app, the tools and the tests all call it; real football data sets its targets and squads.</text>

  <!-- Web app -->
  <rect x="40" y="105" width="780" height="195" rx="16" fill="#EEF4FE" stroke="#8DB4F0" stroke-width="1.5"/>
  <text x="62" y="135" class="lab" fill="#3D72C4">WEB APP</text>
  <text x="140" y="135" class="labs">Next.js · runs in the browser · live on Vercel</text>
  <g>
    <rect x="60" y="152" width="178" height="100" rx="10" class="card" stroke="#8DB4F0"/>
    <text x="149" y="180" text-anchor="middle" class="h">Matchday</text>
    <text x="149" y="203" text-anchor="middle" class="b">pick 2 of 96 real clubs</text>
    <text x="149" y="221" text-anchor="middle" class="b">seed · venue · league or cup</text>
    <text x="149" y="239" text-anchor="middle" class="b">kick off or simulate</text>

    <rect x="252" y="152" width="178" height="100" rx="10" class="card" stroke="#8DB4F0"/>
    <text x="341" y="180" text-anchor="middle" class="h">Squad &amp; tactics</text>
    <text x="341" y="203" text-anchor="middle" class="b">formation · 6 tactics</text>
    <text x="341" y="221" text-anchor="middle" class="b">edit any player's</text>
    <text x="341" y="239" text-anchor="middle" class="b">10 ratings</text>

    <rect x="444" y="152" width="178" height="100" rx="10" class="card" stroke="#8DB4F0"/>
    <text x="533" y="180" text-anchor="middle" class="h">Live match + report</text>
    <text x="533" y="203" text-anchor="middle" class="b">2D pitch · 4 speeds</text>
    <text x="533" y="221" text-anchor="middle" class="b">subs and tactic changes</text>
    <text x="533" y="239" text-anchor="middle" class="b">"why this result"</text>

    <rect x="636" y="152" width="164" height="100" rx="10" class="card" stroke="#8DB4F0"/>
    <text x="718" y="180" text-anchor="middle" class="h">Engine Lab</text>
    <text x="718" y="203" text-anchor="middle" class="b">realism · balance · speed</text>
    <text x="718" y="221" text-anchor="middle" class="b">a full real-league season</text>
    <text x="718" y="239" text-anchor="middle" class="b">new random seed each run</text>
  </g>
  <text x="62" y="281" class="labs">Batches (Lab runs, a season) run on up to 6 Web Workers, about 18 matches a second. Saves and history stay in the browser.</text>

  <!-- Command-line tools -->
  <rect x="850" y="105" width="310" height="195" rx="16" fill="#FFF4EB" stroke="#F2B98A" stroke-width="1.5"/>
  <text x="872" y="135" class="lab" fill="#C46A2A">COMMAND-LINE TOOLS</text>
  <text x="872" y="155" class="labs">Node · tools/*.mjs · worker threads</text>
  <text x="872" y="185" class="m">simulate</text><text x="985" y="185" class="b">one match, printed</text>
  <text x="872" y="204" class="m">calibrate</text><text x="985" y="204" class="b">engine vs real data</text>
  <text x="872" y="223" class="m">balance</text><text x="985" y="223" class="b">tactic win rates</text>
  <text x="872" y="242" class="m">attributes</text><text x="985" y="242" class="b">+3 in one rating</text>
  <text x="872" y="261" class="m">fetch-data</text><text x="985" y="261" class="b">download the data</text>
  <text x="872" y="280" class="m">build-*</text><text x="985" y="280" class="b">data → JSON files</text>

  <!-- Shared library -->
  <rect x="40" y="345" width="250" height="255" rx="16" fill="#EDF8F1" stroke="#8FD1AA" stroke-width="1.5"/>
  <text x="62" y="375" class="lab" fill="#2F8A57">SHARED LIBRARY</text>
  <text x="62" y="393" class="labs">src/lib</text>
  <text x="62" y="425" class="m">util.ts</text>
  <text x="62" y="443" class="b">real clubs, line-ups, kit clashes</text>
  <text x="62" y="473" class="m">season.ts</text>
  <text x="62" y="491" class="b">fixtures, injuries, bans, table</text>
  <text x="62" y="521" class="m">metrics.js</text>
  <text x="62" y="539" class="b">same stats for real and simulated</text>
  <text x="62" y="569" class="m">batch.ts</text>
  <text x="62" y="587" class="b">the Web Worker pool</text>

  <!-- Match engine -->
  <rect x="320" y="345" width="560" height="255" rx="16" fill="#F2EFFD" stroke="#A99BEA" stroke-width="1.8"/>
  <text x="342" y="375" class="lab" fill="#6A57C9">MATCH ENGINE · v0.6.1</text>
  <text x="342" y="394" class="labs">src/engine/engine.js · about 1,760 lines · no dependencies · typed by engine.d.ts</text>
  <g>
    <rect x="338" y="408" width="124" height="108" rx="10" class="card" stroke="#A99BEA"/>
    <text x="400" y="434" text-anchor="middle" class="h">Tick loop</text>
    <text x="400" y="457" text-anchor="middle" class="b">0.25 s steps</text>
    <text x="400" y="475" text-anchor="middle" class="b">22,000 a match</text>
    <text x="400" y="493" text-anchor="middle" class="b">move · tire · press</text>

    <rect x="473" y="408" width="124" height="108" rx="10" class="card" stroke="#A99BEA"/>
    <text x="535" y="434" text-anchor="middle" class="h">Decisions</text>
    <text x="535" y="457" text-anchor="middle" class="b">picks the option</text>
    <text x="535" y="475" text-anchor="middle" class="b">worth the most</text>
    <text x="535" y="495" text-anchor="middle" class="m">_decide()</text>

    <rect x="608" y="408" width="124" height="108" rx="10" class="card" stroke="#A99BEA"/>
    <text x="670" y="434" text-anchor="middle" class="h">Laws 2026/27</text>
    <text x="670" y="457" text-anchor="middle" class="b">offside · fouls</text>
    <text x="670" y="475" text-anchor="middle" class="b">cards · advantage</text>
    <text x="670" y="493" text-anchor="middle" class="b">restarts · subs</text>
    <text x="670" y="511" text-anchor="middle" class="b">extra time · pens</text>

    <rect x="743" y="408" width="124" height="108" rx="10" class="card" stroke="#A99BEA"/>
    <text x="805" y="434" text-anchor="middle" class="h">Tuning</text>
    <text x="805" y="456" text-anchor="middle" class="m">TUNING</text>
    <text x="805" y="473" text-anchor="middle" class="m">TACTIC_EDGE</text>
    <text x="805" y="490" text-anchor="middle" class="m">MATCHUPS</text>
    <text x="805" y="507" text-anchor="middle" class="m">FORMATION_EDGE</text>
  </g>
  <rect x="338" y="528" width="529" height="58" rx="10" fill="#FFFFFF" stroke="#A99BEA" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="354" y="562" class="h">Public API</text>
  <text x="440" y="552" class="m" style="font-size:11px">makeTeam · validateLineup · new Match · simulateMatch</text>
  <text x="440" y="571" class="m" style="font-size:11px">step · runUntil · substitute · save/load · result · explain</text>

  <!-- Real football data -->
  <rect x="910" y="345" width="250" height="255" rx="16" fill="#FFF9E6" stroke="#EBCB6B" stroke-width="1.5"/>
  <text x="932" y="375" class="lab" fill="#A7841B">REAL FOOTBALL DATA</text>
  <text x="932" y="408" class="h">football-data.co.uk</text>
  <text x="932" y="428" class="b">8,907 matches + odds, top 5</text>
  <text x="932" y="446" class="b">leagues, 2021/22 to 2025/26</text>
  <text x="932" y="466" class="m">→ reference.json (targets)</text>
  <text x="932" y="505" class="h">transfermarkt-datasets</text>
  <text x="932" y="525" class="b">96 clubs × 20 players</text>
  <text x="932" y="543" class="b">open data (CC0)</text>
  <text x="932" y="563" class="m">→ teams.json (squads)</text>

  <!-- Checks -->
  <rect x="40" y="645" width="1120" height="120" rx="16" fill="#FDEFF4" stroke="#EDA1BB" stroke-width="1.5"/>
  <text x="62" y="675" class="lab" fill="#C2487A">CHECKS</text>
  <g>
    <rect x="60" y="690" width="350" height="58" rx="10" class="card" stroke="#EDA1BB"/>
    <text x="235" y="714" text-anchor="middle" class="h">103 tests in 9 files</text>
    <text x="235" y="734" text-anchor="middle" class="b">84 quick · 19 statistical (skipped in quick mode)</text>

    <rect x="425" y="690" width="350" height="58" rx="10" class="card" stroke="#EDA1BB"/>
    <text x="600" y="714" text-anchor="middle" class="h">24 of 24 checks against real football</text>
    <text x="600" y="734" text-anchor="middle" class="b">npm run calibrate · 3,000 matches</text>

    <rect x="790" y="690" width="350" height="58" rx="10" class="card" stroke="#EDA1BB"/>
    <text x="965" y="714" text-anchor="middle" class="h">CI: 4 jobs on Linux, Windows, macOS</text>
    <text x="965" y="734" text-anchor="middle" class="b">typecheck · tests · a headless match · build</text>
  </g>

  <!-- Arrows -->
  <line x1="600" y1="300" x2="600" y2="342" class="line" marker-end="url(#ar)"/>
  <rect x="612" y="310" width="226" height="22" rx="11" fill="#FFFFFF" stroke="#D9D5E6"/>
  <text x="725" y="325" text-anchor="middle" class="pill">step() · snapshot() · simulateMatch()</text>

  <path d="M1000 300 V322 H860 V342" class="line" marker-end="url(#ar)"/>
  <path d="M1110 300 V342" class="dash" marker-end="url(#ar)"/>
  <rect x="1050" y="310" width="76" height="22" rx="11" fill="#FFFFFF" stroke="#D9D5E6"/>
  <text x="1088" y="325" text-anchor="middle" class="pill">built once</text>

  <line x1="290" y1="470" x2="317" y2="470" class="line" marker-end="url(#ar)"/>
  <line x1="910" y1="470" x2="883" y2="470" class="line" marker-end="url(#ar)"/>

  <line x1="600" y1="645" x2="600" y2="603" class="line" marker-end="url(#ar)"/>
  <rect x="612" y="613" width="214" height="22" rx="11" fill="#FFFFFF" stroke="#D9D5E6"/>
  <text x="719" y="628" text-anchor="middle" class="pill">fail if a law breaks or numbers drift</text>

  <!-- Legend -->
  <line x1="40" y1="805" x2="90" y2="805" class="line" marker-end="url(#ar)"/>
  <text x="100" y="809" class="labs">calls or feeds</text>
  <line x1="220" y1="805" x2="270" y2="805" class="dash" marker-end="url(#ar)"/>
  <text x="280" y="809" class="labs">run by hand when the data changes</text>
  <text x="530" y="809" class="m">monospace</text>
  <text x="608" y="809" class="labs">= a name in the code</text>
</svg>
